[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-share-file"
version = "0.2.0"
description = "Share a single file through a Cloudflare quick tunnel."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["qrcode>=8.2,<9"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/gabrys/cf-share-file"
Issues = "https://github.com/gabrys/cf-share-file/issues"

[project.scripts]
cf-share-file = "cf_share_file:main"

[tool.setuptools]
py-modules = ["cf_share_file"]
